<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | Cottage Candles</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Ovo&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="Nav-container">
        <div class="Navbar">
            <div class="Branding">
                <img src="/images/logo-dark.png" alt="Logo" class="Brand-logo" />
                <h1>Cottage Candles</h1>
            </div>
            <div class="Nav-links">
        <a href="index.html" id="buttons"><span class="text">Home</span><span>Home</span></a>
        <a href="shop.html" id="buttons"><span class="text">Shop</span><span>Shop</span></a>
        <a href="about.html" id="buttons"><span class="text">About</span><span>About</span></a>
        <a href="blog.html" id="buttons"><span class="text">Blog</span><span>Blog</span></a>
      </div>

            <div class="Nav-buttons">
                <div class="nav-actions desktop-nav">
                    <button class="nav-btn theme-toggle cursor-target light-mode" id="theme-toggle"
                        aria-label="Toggle theme">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="moon" class="lucide lucide-moon theme-icon moon-icon">
                            <path
                                d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401">
                            </path>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="sun" class="lucide lucide-sun theme-icon sun-icon">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                        </svg>
                    </button>
                    <a href="profile.html" class="nav-btn cursor-target" aria-label="User account">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="user" class="lucide lucide-user">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                    <button class="nav-btn cursor-target" aria-label="Shopping cart" id="cart-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="shopping-bag" class="lucide lucide-shopping-bag">
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                            <path d="M3.103 6.034h17.794"></path>
                            <path
                                d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="MobileMenu">
            Menu
            <input id="checkbox2" type="checkbox" />
            <label class="toggle toggle2" for="checkbox2">
                <div id="bar4" class="bars"></div>
                <div id="bar5" class="bars"></div>
                <div id="bar6" class="bars"></div>
            </label>
        </div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" data-form="login">Login</button>
                <button class="auth-tab" data-form="signup">Signup</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                    <a href="#" class="forgot-password-link" id="show-forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-premium">Sign In</button>
                <div class="divider"><span>OR</span></div>
                <button type="button" class="btn-google" id="google-login">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continue with Google
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <h2>Create Account</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstName" required placeholder="First Name">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastName" required placeholder="Last Name">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="tel" name="contact" placeholder="Phone Number">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-premium">Create Account</button>
                <div class="divider"><span>OR</span></div>
                <button type="button" class="btn-google" id="google-signup">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continue with Google
                </button>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgot-password-form" class="auth-form">
                <h2>Reset Password</h2>
                <p>We'll send an OTP to your email to reset your password.</p>
                <div id="forgot-email-step">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="forgot-email" required placeholder="name@example.com">
                    </div>
                    <button type="button" class="btn-premium" id="send-otp-btn">Send OTP</button>
                </div>
                <div id="forgot-otp-step" style="display: none;">
                    <div class="form-group">
                        <label>Enter OTP</label>
                        <input type="text" id="reset-otp" required placeholder="6-digit OTP">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="new-password" required placeholder="••••••••">
                    </div>
                    <button type="button" class="btn-premium" id="reset-password-btn">Reset Password</button>
                </div>
                <a href="#" class="back-to-login" id="back-to-login">Back to Login</a>
            </form>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script type="module" src="/js/script.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
