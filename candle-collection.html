  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"

  <!-- Theme-based Image Switching Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Function to update all theme-switchable images
      function updateThemeImages() {
        const isDark = document.body.classList.contains('dark-theme');
        const images = document.querySelectorAll('.theme-switchable-image');

        images.forEach(img => {
          const lightSrc = img.getAttribute('data-light-src');
          const darkSrc = img.getAttribute('data-dark-src');

          if (lightSrc && darkSrc) {
            img.src = isDark ? darkSrc : lightSrc;
          }
        });
      }

      // Load products from JSON
      fetch('products.json')
        .then(r => r.json())
        .then(products => {
          const grid = document.getElementById('candle-grid');
          const promoCard = grid.querySelector('.promo-card');
          
          // Clear current content except promo card
          const cards = grid.querySelectorAll('.product-card:not(.promo-card)');
          cards.forEach(card => card.remove());

          // Categories mapping for sub-text (Optional, but helps keep it looking nice)
          const categories = {
            "candle-1": "Sweet Dessert",
            "candle-2": "Bright Citrus",
            "candle-3": "Warm & Roasted",
            "candle-4": "Fresh Breeze",
            "candle-5": "Holiday Spirit",
            "candle-6": "Baked Goodness",
            "candle-7": "Graceful & Pure",
            "candle-8": "Floral & Sweet",
            "candle-9": "Bright & Sunny",
            "candle-10": "Festive Delight",
            "candle-11": "Magical Whimsy",
            "candle-12": "Artistic Stick",
            "candle-13": "Coastal Chic",
            "candle-14": "Spring Blooms"
          };

          // Tooling for badges (Optional)
          const badges = {
            "candle-1": "POPULAR",
            "candle-3": "NEW",
            "candle-6": "50% OFF",
            "candle-7": "ELEGANT",
            "candle-13": "NEW"
          };

          // Add products
          let candleIndex = 0;
          Object.values(products).forEach((p) => {
            if (p.id.startsWith('candle-')) {
              const currentIndex = candleIndex++;
              const card = document.createElement('div');
              card.className = 'product-card';
              
              const badgeHtml = badges[p.id] ? `<span class="badge">${badges[p.id]}</span>` : '';
              const subText = categories[p.id] || "";
              
              card.innerHTML = `
                <div class="card-image">
                  ${badgeHtml}
                  <img src="${p.imageLight}" alt="${p.name}"
                    data-light-src="${p.imageLight}"
                    data-dark-src="${p.imageDark}" class="theme-switchable-image">
                </div>
                <div class="card-details">
                  <h3>${p.name}</h3>
                  <p class="sub-text">${subText}</p>
                  <div class="card-actions">
                    <button class="btn-view"
                      onclick="event.stopPropagation(); location.href='candles.html?product=${currentIndex}'">View</button>
                    <button class="btn-buy" onclick="event.stopPropagation(); addToCart('${p.id}')">Buy Now</button>
                  </div>
                  <div class="price-row">
                    <span class="price">$${p.price.toFixed(2)}</span>
                  </div>
                </div>
              `;
              
              grid.insertBefore(card, promoCard);
            }
          });
          
          // Initial theme image update
          updateThemeImages();
        });

      // Update images on initial load based on saved theme
      updateThemeImages();

      // Listen for theme toggle clicks
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          // Wait for theme class to be applied
          setTimeout(updateThemeImages, 50);
        });
      }

      // Also observe body class changes (in case theme changes from other sources)
      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.attributeName === 'class') {
            updateThemeImages();
          }
        });
      });

      observer.observe(document.body, {
        attributes: true,
        attributeFilter: ['class']
      });
    });
  </script>
