<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Ovo&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div class="Nav-container">
      <div class="Navbar">
        <div class="Branding">
          <img src="/images/logo-light.png" alt="Logo" class="Brand-logo" />
          <h1>Cottage Candles</h1>
        </div>
        <div class="Nav-links">
          <button id="buttons">
            <span class="text">Home</span><span>Home</span>
          </button>
          <button id="buttons">
            <span class="text">Shop</span><span>Shop</span>
          </button>
          <button id="buttons">
            <span class="text">About</span><span>About</span>
          </button>
          <button id="buttons">
            <span class="text">Blog</span><span>Blog</span>
          </button>
        </div>

        <div class="Nav-buttons">
          <div class="nav-actions desktop-nav">
            <button
              class="nav-btn theme-toggle cursor-target light-mode"
              id="theme-toggle"
              aria-label="Toggle theme"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                data-lucide="moon"
                class="lucide lucide-moon theme-icon moon-icon"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                ></path>
              </svg>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                data-lucide="sun"
                class="lucide lucide-sun theme-icon sun-icon"
              >
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
              </svg>
            </button>
            <button class="nav-btn cursor-target" aria-label="User account">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                data-lucide="user"
                class="lucide lucide-user"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </button>
            <button class="nav-btn cursor-target" aria-label="Search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                data-lucide="search"
                class="lucide lucide-search"
              >
                <path d="m21 21-4.34-4.34"></path>
                <circle cx="11" cy="11" r="8"></circle>
              </svg>
            </button>
            <button class="nav-btn cursor-target" aria-label="Shopping cart">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                data-lucide="shopping-bag"
                class="lucide lucide-shopping-bag"
              >
                <path d="M16 10a4 4 0 0 1-8 0"></path>
                <path d="M3.103 6.034h17.794"></path>
                <path
                  d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="MobileMenu">
        Menu
        <input id="checkbox2" type="checkbox" />
        <label class="toggle toggle2" for="checkbox2">
          <div id="bar4" class="bars"></div>
          <div id="bar5" class="bars"></div>
          <div id="bar6" class="bars"></div>
        </label>
      </div>
    </div>

    <div class="content">
      <div class="Welcome">Welcome</div>
      <div class="main-content">
        <div class="Intro-line">We're</div>
        <div class="Brand-name">cottage<br />candles</div>
        <div class="Tagline-line Homemade">
          a
          <div id="container">
            <div id="flip">
              <div><div>homemade</div></div>
              <div><div>100% pure</div></div>
            </div>
          </div>
        </div>
        <div class="Tagline-line BrandWord">brand</div>
      </div>
      <div class="Est">Est. 2025</div>
    </div>

    <div class="Categories-Div">
      <div class="Square-Container">
        <div class="Square-Div">
          <div class="sliding-images">
            <img src="https://images.pexels.com/photos/289756/pexels-photo-289756.jpeg?cs=srgb&dl=pexels-erenlerhakan-289756.jpg&fm=jpg" alt="Image 1" class="slide-image image-1" />
            <img src="https://cdn.mos.cms.futurecdn.net/m9Nz2b2ur2PFomz3VjXgCV.jpg" alt="Image 2" class="slide-image image-2" />
            <img src="https://cdn.manifestmagazine.in/2024/11/Binge-bakery-Hamper-3.jpg" alt="Image 3" class="slide-image image-3" />
          </div>
        </div>
      </div>
      <div class="Candle-Category"></div>
      <div class="Diffuser-Category"></div>
      <div class="Hamper-Category"></div></div>
    </div>

    <div class="Footer"></div>
  </body>
  <script src="/js/script.js"></script>
</html>
